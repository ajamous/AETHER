# Prometheus Operator PrometheusRule manifest for Aether.
#
# Apply this when your cluster runs the Prometheus Operator
# (kube-prometheus-stack, prometheus-community/kube-prometheus-stack,
# Coreos Prometheus Operator). The Operator picks up PrometheusRule
# CRDs that match its `ruleSelector` labels and feeds them into the
# managed Prometheus.
#
# Adopters running plain Prometheus (no Operator) should use the
# rules file at ../prometheus/prometheus-rules.yaml directly.
#
# The label `release: kube-prometheus-stack` matches the default
# selector that Helm-installed kube-prometheus-stack uses. Adjust
# it if your install uses a different release name.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aether
  labels:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: observability
    release: kube-prometheus-stack
spec:
  groups:
    - name: aether-audit-chain
      interval: 60s
      rules:
        - alert: AetherAuditChainBroken
          expr: aether_audit_chain_ok == 0
          for: 0m
          labels:
            severity: sev-1
            aether_component: audit
          annotations:
            summary: Audit hash chain integrity check failed
            description: |
              services/audit reports aether_audit_chain_ok=0. Always
              Sev-1; see docs/sas-sm/incident-response.md.
            runbook_url: https://github.com/ajamous/aether/blob/main/docs/sas-sm/incident-response.md#audit-chain-break-sub-procedure-always-sev-1

        - alert: AetherAuditMetricsScrapeFailing
          expr: up{job="aether",aether_component="audit"} == 0
          for: 5m
          labels:
            severity: sev-2
            aether_component: audit
          annotations:
            summary: Audit /metrics scrape is failing
            description: Cannot reach services/audit /metrics — silence is not a green light.

    - name: aether-certs
      interval: 300s
      rules:
        - alert: AetherCertExpiringSoon
          expr: aether_cert_expiry_days < 30
          for: 30m
          labels:
            severity: sev-3
            aether_component: certmgr
          annotations:
            summary: Aether identity cert {{ $labels.name }} expiring in {{ $value }} days

        - alert: AetherCertExpiringUrgent
          expr: aether_cert_expiry_days < 7
          for: 10m
          labels:
            severity: sev-2
            aether_component: certmgr
          annotations:
            summary: Aether identity cert {{ $labels.name }} expires in {{ $value }} days

        - alert: AetherCertExpired
          expr: aether_cert_expiry_days <= 0
          for: 0m
          labels:
            severity: sev-1
            aether_component: certmgr
          annotations:
            summary: Aether identity cert {{ $labels.name }} HAS EXPIRED

    - name: aether-service-health
      interval: 30s
      rules:
        - alert: AetherServiceDown
          expr: kube_deployment_status_replicas_unavailable{deployment=~"aether-.+", namespace="aether"} > 0
          for: 2m
          labels:
            severity: sev-2
          annotations:
            summary: Aether deployment {{ $labels.deployment }} has unavailable replicas

        - alert: AetherServiceCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="aether"}[10m]) > 0
          for: 10m
          labels:
            severity: sev-2
          annotations:
            summary: Pod {{ $labels.pod }} crash-looping

    - name: aether-hsm
      interval: 30s
      rules:
        - alert: AetherHSMBrokerUnhealthy
          expr: aether_hsm_broker_ready == 0
          for: 1m
          labels:
            severity: sev-1
            aether_component: hsm-broker
          annotations:
            summary: HSM broker reports unhealthy
            description: backend={{ $labels.backend }}. Signing flows downstream are failing.

    - name: aether-postgres
      interval: 60s
      rules:
        - alert: AetherPostgresConnectionsExhausted
          expr: |
            sum(pg_stat_activity_count{datname="aether"}) /
            on() group_left() pg_settings_max_connections > 0.8
          for: 5m
          labels:
            severity: sev-2
            aether_component: postgres
          annotations:
            summary: Aether Postgres > 80% connection utilisation
