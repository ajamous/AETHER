# Aether default values. Override what you need; leave the rest.
#
# Production deployments must override:
#   - postgres.password (or postgres.existingSecret)
#   - hsm.backend = "external" + hsm.pkcs11.libraryPath etc
#   - certmgr.mode = "production" + certmgr.trustStore (PEM contents)
#   - ingress.host
#
# See deployments/helm/aether/README.md for the production checklist.

global:
  # Image tag override applied to every Aether service unless the
  # service-specific .image.tag wins.
  imageTag: 0.1.0
  imagePullPolicy: IfNotPresent
  # Where built-with images live. Override for your registry.
  imageRegistry: ghcr.io/ajamous

# ----------------------------------------------------------------------
# Datastores
# ----------------------------------------------------------------------

postgres:
  # Set to false if you bring your own Postgres (recommended for prod).
  # When false, set postgres.url to the connection string.
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  user: aether
  database: aether
  # Lab default. CHANGE IN PRODUCTION or use existingSecret.
  password: aether
  existingSecret: ""  # name of a Secret with a 'password' key
  storage:
    size: 10Gi
    storageClassName: ""  # cluster default
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Connection string used by services; computed if postgres.enabled.
postgresUrl: ""

# ----------------------------------------------------------------------
# Aether services
# ----------------------------------------------------------------------

hsmBroker:
  enabled: true
  image:
    repository: aether/hsm-broker
    tag: ""  # falls back to global.imageTag
  # Backend: memory | softhsm | external
  # memory  — process memory. Lab and demo only.
  # softhsm — PKCS#11 against the SoftHSM library mounted in the pod.
  # external — point at a real HSM via PKCS#11 path + slot + PIN.
  backend: memory
  pkcs11:
    libraryPath: /usr/lib/softhsm/libsofthsm2.so
    slot: "0"
    pinSecret:
      # name of a Secret with a 'pin' key. Required for softhsm/external.
      name: ""
  service:
    port: 8443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

certmgr:
  enabled: true
  image:
    repository: aether/certmgr
    tag: ""
  # mode: lab | production
  mode: lab
  # trustStore is the CI roots PEM (concatenated, multi-line). For
  # `production`, you must provide your own. For `lab`, leave empty —
  # an initContainer mints a fresh SGP.26-style chain on every pod
  # start (see lab.certInit below).
  trustStore: ""
  intermediates: ""
  # Existing secret holding identity keys (DPtls/DPauth/DPpb). Required
  # for `production` mode. The chart does NOT generate or store
  # production private keys.
  identitySecret:
    name: ""
  # Lab-mode auto-bootstrap. The initContainer runs
  # `certmgr --generate-lab=/certs` on every pod start, dropping a
  # fresh ECDSA P-256 chain (CI root → EUM → DPtls/DPauth/DPpb)
  # into an emptyDir mounted at /certs. Production mode skips this
  # path entirely; CI-issued certs come from identitySecret + the
  # trustStore ConfigMap. Set false to opt out (e.g. when
  # pre-populating /certs from your own source).
  lab:
    certInit:
      enabled: true
  service:
    port: 8444
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

smdpPlus:
  enabled: true
  image:
    repository: aether/smdp-plus
    tag: ""
  service:
    port: 8445
  sessionTtl: 10m
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  replicaCount: 1

smds:
  enabled: true
  image:
    repository: aether/smds
    tag: ""
  service:
    port: 8448
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

eim:
  enabled: true
  image:
    repository: aether/eim
    tag: ""
  service:
    port: 8449
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

profileBuilder:
  enabled: true
  image:
    repository: aether/profile-builder
    tag: ""
  service:
    port: 8446
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

audit:
  enabled: true
  image:
    repository: aether/audit
    tag: ""
  service:
    port: 8447
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  replicaCount: 1

gateway:
  enabled: true
  image:
    repository: aether/gateway
    tag: ""
  service:
    port: 8080
  # TLS for the gateway listener and mTLS for the ES2+ surface.
  # Lab default is plain HTTP — no client-cert checks. Production
  # MUST set both .tls.serverSecret and .tls.es2plusClientCASecret.
  #
  # tls.serverSecret: name of a Secret with `tls.crt` and `tls.key`
  #                   keys (the standard Kubernetes TLS Secret type).
  # tls.es2plusClientCASecret: name of a Secret with a `ca.crt` key
  #                            holding the PEM bundle of CAs whose
  #                            client certs the gateway accepts on
  #                            /gsma/rsp2/es2plus/*.
  tls:
    serverSecret: ""
    es2plusClientCASecret: ""
  # Rate limiting on /gsma/rsp2/* (per source IP). Both must be > 0
  # to enable; lab default is disabled. See services/gateway/README.md
  # for the full SAS-SM rationale (default key is RemoteAddr; do not
  # trust X-Forwarded-For without a trusted-proxy CIDR list at the LB).
  rateLimit:
    rps: 0
    burst: 0
  # Bearer-token OIDC on /v1/* admin paths. Both `issuer` and
  # `audience` must be set to enable; lab default is disabled.
  # /v1/health and /metrics bypass unconditionally so kube-probes
  # and Prometheus can scrape unauthenticated. RS256 + ES256 only;
  # symmetric algorithms are deliberately rejected.
  oidc:
    issuer: ""
    audience: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  replicaCount: 1

ui:
  enabled: true
  image:
    repository: aether/admin-ui
    tag: ""
  service:
    port: 3000
  # OIDC sign-in for the admin UI (Auth.js). When `oidc.issuer`,
  # `oidc.credentialsSecret`, and `oidc.authSecretName` are all set,
  # every page is gated behind a valid session and unauthenticated
  # users are bounced to the IdP. When unset (lab default), the UI
  # renders a yellow "AUTH DISABLED" banner and lets every request
  # through — never expose this configuration on a network.
  #
  # credentialsSecret should hold:
  #   - clientId      (string)
  #   - clientSecret  (string)
  # authSecretName should hold:
  #   - secret  (random 32-byte string for cookie signing; use
  #             `openssl rand -base64 32` to mint)
  oidc:
    issuer: ""
    credentialsSecret: ""
    authSecretName: ""
    # Optional space-delimited override for OAuth scopes; defaults
    # to "openid profile email" if unset.
    scopes: ""
    # Optional. The canonical URL of this UI as the IdP sees it
    # (e.g. https://aether.your-mvno.com). Required for the OIDC
    # callback when behind an ingress.
    publicUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  replicaCount: 1

# ----------------------------------------------------------------------
# Ingress (optional)
# ----------------------------------------------------------------------

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: aether.example
  tls:
    enabled: false
    secretName: ""

# ----------------------------------------------------------------------
# RBAC and security defaults applied to every Aether pod
# ----------------------------------------------------------------------

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ----------------------------------------------------------------------
# Observability — chart emits Prometheus annotations; alert rules and
# ServiceMonitor manifests live under deployments/observability/.
# ----------------------------------------------------------------------

metrics:
  prometheusAnnotations: true

# Optional: render the Prometheus Operator CRDs (PrometheusRule +
# ServiceMonitor) inside the release. Off by default — the chart
# does not assume the Operator is installed. Adopters with
# kube-prometheus-stack flip this on; everyone else applies the
# raw rules YAML manually from deployments/observability/.
observability:
  prometheusOperator:
    enabled: false
    # Selector label the Operator looks for. Default matches the
    # kube-prometheus-stack release name; override for other installs.
    releaseLabel: kube-prometheus-stack
