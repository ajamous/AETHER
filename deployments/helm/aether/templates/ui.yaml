{{- $name := printf "%s-ui" (include "aether.fullname" .) -}}
{{- if .Values.ui.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "aether.componentLabels" (list . "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aether
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels: {{- include "aether.componentLabels" (list . "ui") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aether.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "aether.image" (list . .Values.ui) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: AETHER_GATEWAY_URL
              value: "http://{{ include "aether.fullname" . }}-gateway:{{ .Values.gateway.service.port }}"
            - name: AETHER_AUDIT_URL
              value: "http://{{ include "aether.fullname" . }}-audit:{{ .Values.audit.service.port }}"
            - name: AETHER_CERTMGR_URL
              value: "http://{{ include "aether.fullname" . }}-certmgr:{{ .Values.certmgr.service.port }}"
            - name: PORT
              value: "{{ .Values.ui.service.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.port }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "aether.componentLabels" (list . "ui") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: aether
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
{{- end -}}
