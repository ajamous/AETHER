name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: build artifacts (per service)
        run: |
          set -e
          mkdir -p dist
          # Workspace mode: build each service's cmd/* binary into dist/.
          # Modules without a cmd/ subtree (pkg/* libraries, services
          # without a binary) are skipped.
          for d in $(find ./services -name go.mod -not -path './vendor/*' -exec dirname {} \;); do
            name=$(basename "$d")
            if [ ! -d "$d/cmd" ]; then continue; fi
            echo "==> build $name"
            (cd "$d" && go build -trimpath -ldflags="-s -w" -o "../../dist/$name" ./cmd/...)
          done
          ls -la dist/

      - name: generate SBOM
        run: |
          syft dir:. -o spdx-json=dist/sbom.spdx.json || true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**
