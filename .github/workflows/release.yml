name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: build artifacts
        run: |
          if find . -name go.mod -not -path './vendor/*' | grep -q .; then
            go build -trimpath -ldflags="-s -w" -o dist/ ./...
          else
            mkdir -p dist
            echo "no Go modules yet; releasing scaffold only" > dist/README.txt
          fi

      - name: generate SBOM
        run: |
          syft dir:. -o spdx-json=dist/sbom.spdx.json || true

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**
