name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['go']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Aether is a Go workspace with multiple modules. CodeQL's
      # built-in autobuild tries to use the runner's default Go
      # (1.22 historically) and fails on go.work + per-module
      # go.mod files that require newer toolchains (pgx/v5 needs
      # 1.25). Build explicitly per module so the trace covers
      # the whole workspace.
      - name: build (per module, traced)
        run: |
          # Tolerate modules whose only files are behind a build tag
          # (e.g. test/e2e is gated by `//go:build lab`).
          for d in $(find . -name go.mod -not -path './vendor/*' -not -path './ui/admin/node_modules/*' -exec dirname {} \;); do
            echo "==> build $d"
            out=$(cd "$d" && go build ./... 2>&1)
            rc=$?
            if [ $rc -ne 0 ] && ! echo "$out" | grep -q 'matched no packages'; then
              echo "$out"; exit $rc
            fi
          done

      - name: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
