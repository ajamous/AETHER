name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha is missing a DCO sign-off line"
              missing=1
            fi
          done
          exit $missing

  build:
    name: build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go vet (per module)
        run: |
          # Workspace mode: ./... from the repo root doesn't expand
          # across go.mod boundaries. Iterate per module. Tolerate
          # modules whose only files are behind a build tag (e.g.
          # test/e2e is gated by `//go:build lab`).
          for d in $(find . -name go.mod -not -path './vendor/*' -not -path './ui/admin/node_modules/*' -exec dirname {} \;); do
            echo "==> vet $d"
            out=$(cd "$d" && go vet ./... 2>&1)
            rc=$?
            if [ $rc -ne 0 ] && ! echo "$out" | grep -q 'matched no packages'; then
              echo "$out"; exit $rc
            fi
          done
      - name: build (per module)
        run: |
          for d in $(find . -name go.mod -not -path './vendor/*' -not -path './ui/admin/node_modules/*' -exec dirname {} \;); do
            echo "==> build $d"
            out=$(cd "$d" && go build ./... 2>&1)
            rc=$?
            if [ $rc -ne 0 ] && ! echo "$out" | grep -q 'matched no packages'; then
              echo "$out"; exit $rc
            fi
          done
      - name: test (per module)
        run: |
          for d in $(find . -name go.mod -not -path './vendor/*' -not -path './ui/admin/node_modules/*' -exec dirname {} \;); do
            echo "==> test $d"
            out=$(cd "$d" && go test ./... 2>&1)
            rc=$?
            if [ $rc -ne 0 ] && ! echo "$out" | grep -q 'matched no packages'; then
              echo "$out"; exit $rc
            fi
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

  govulncheck:
    name: govulncheck (per module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: install govulncheck
        # Pinned major version so a backward-incompatible CLI
        # change can't silently flip the scanner's behaviour. We
        # follow the upstream `latest` floating tag deliberately
        # within the v1.x series so the CVE database stays fresh.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan every Go module
        # Workspace mode: ./... from the repo root doesn't expand
        # across go.mod boundaries. Iterate per module, mirror the
        # exact pattern the build/test job uses.
        #
        # govulncheck does call-graph analysis: it only reports
        # vulnerabilities in code paths the program actually
        # reaches. That keeps the false-positive rate low compared
        # to a naive lockfile scan.
        #
        # Exit codes: 0 = clean, 3 = vulnerabilities found. We
        # fail the job on 3 and tolerate the "no packages
        # matched" case for modules whose only files are behind a
        # build tag (e.g. test/e2e under `//go:build lab`). Note:
        # govulncheck phrases this as `no packages matched`, while
        # `go build`/`go test` say `matched no packages`. We grep
        # for `no packages` to catch both forms.
        run: |
          fail=0
          for d in $(find . -name go.mod -not -path './vendor/*' -not -path './ui/admin/node_modules/*' -exec dirname {} \;); do
            echo "==> govulncheck $d"
            out=$(cd "$d" && govulncheck ./... 2>&1) || rc=$?
            rc=${rc:-0}
            if [ $rc -ne 0 ] && ! echo "$out" | grep -qE 'no packages|matched no'; then
              echo "$out"
              fail=1
            else
              echo "$out" | head -5
            fi
            unset rc
          done
          exit $fail

  postgres-integration:
    name: postgres persistence integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      AETHER_PG_URL: postgres://aether:aether@127.0.0.1:5432/aether_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: audit ledger integration tests
        working-directory: services/audit
        run: go test -count=1 ./internal/chain/...
      - name: smds event store integration tests
        working-directory: services/smds
        run: go test -count=1 ./internal/events/...
      - name: smdp-plus session store integration tests
        working-directory: services/smdp-plus
        run: go test -count=1 ./internal/session/...

  softhsm-integration:
    name: hsm-broker softhsm integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: install softhsm2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: init token
        id: token
        run: |
          mkdir -p /tmp/softhsm-test/tokens
          cat > /tmp/softhsm-test/softhsm2.conf <<'EOF'
          directories.tokendir = /tmp/softhsm-test/tokens
          objectstore.backend = file
          log.level = ERROR
          EOF
          SOFTHSM2_CONF=/tmp/softhsm-test/softhsm2.conf softhsm2-util \
            --init-token --slot 0 --label aether-ci --pin 1234 --so-pin 5678
          SLOT=$(SOFTHSM2_CONF=/tmp/softhsm-test/softhsm2.conf softhsm2-util \
            --show-slots | awk '/^Slot/{print $2; exit}')
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: run integration tests
        working-directory: services/hsm-broker
        env:
          AETHER_SOFTHSM_LIB: /usr/lib/softhsm/libsofthsm2.so
          AETHER_SOFTHSM_SLOT: ${{ steps.token.outputs.slot }}
          AETHER_SOFTHSM_PIN: '1234'
          SOFTHSM2_CONF: /tmp/softhsm-test/softhsm2.conf
        run: go test -count=1 ./internal/backend/softhsm/... -v

  helm:
    name: helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - name: helm lint
        run: helm lint deployments/helm/aether
      - name: helm template (lab defaults)
        run: helm template ci deployments/helm/aether > /tmp/lab.yaml
      - name: helm template (production-style override)
        run: |
          helm template ci deployments/helm/aether \
            --set certmgr.mode=production \
            --set certmgr.trustStore="$(printf -- '-----BEGIN CERTIFICATE-----\nFAKE\n-----END CERTIFICATE-----')" \
            --set hsmBroker.backend=softhsm \
            --set hsmBroker.pkcs11.pinSecret.name=hsm-pin \
            --set ingress.enabled=true \
            --set ingress.host=aether.example.com \
            --set observability.prometheusOperator.enabled=true \
            > /tmp/prod.yaml

  conformance:
    name: SGP.23 conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: run conformance suite
        run: go run ./tools/conformance/runner

  prometheus-rules:
    name: prometheus rules lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install promtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/prometheus-2.54.1.linux-amd64/promtool /usr/local/bin/
      - name: lint rules
        run: promtool check rules deployments/observability/prometheus/prometheus-rules.yaml

  openapi-lint:
    name: gateway openapi lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: redocly lint
        working-directory: services/gateway/api/v1
        run: npx --yes @redocly/cli@1.25.0 lint openapi.yaml --max-problems 0
      - name: assert spec is embedded in the gateway binary
        # The Go embed directive copies bytes at build time, so a
        # successful build of services/gateway/api/v1 is the contract
        # that proves the file is reachable from the binary.
        working-directory: services/gateway
        run: go build ./api/...

  grafana-dashboards:
    name: grafana dashboards JSON lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: jq parse every dashboard
        run: |
          shopt -s nullglob
          fail=0
          for f in deployments/observability/grafana/dashboards/*.json; do
            if jq -e . "$f" >/dev/null; then
              echo "ok: $f"
            else
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done
          exit $fail
      - name: assert UID + title + at least one panel per dashboard
        run: |
          shopt -s nullglob
          fail=0
          for f in deployments/observability/grafana/dashboards/*.json; do
            uid=$(jq -r '.uid // empty' "$f")
            title=$(jq -r '.title // empty' "$f")
            panels=$(jq -r '.panels | length' "$f")
            if [ -z "$uid" ] || [ -z "$title" ] || [ "$panels" -lt 1 ]; then
              echo "::error file=$f::missing uid/title or zero panels (uid=$uid, panels=$panels)"
              fail=1
            fi
          done
          exit $fail

  terraform-validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=deployments/terraform/${{ matrix.cloud }} fmt -recursive -check
      - name: terraform init (root)
        run: terraform -chdir=deployments/terraform/${{ matrix.cloud }} init -backend=false
      - name: terraform validate (root)
        run: terraform -chdir=deployments/terraform/${{ matrix.cloud }} validate
      - name: terraform init (examples/full)
        run: terraform -chdir=deployments/terraform/${{ matrix.cloud }}/examples/full init -backend=false
      - name: terraform validate (examples/full)
        run: terraform -chdir=deployments/terraform/${{ matrix.cloud }}/examples/full validate

  ui:
    name: ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: install
        working-directory: ui/admin
        run: npm ci || npm install
      - name: typecheck
        working-directory: ui/admin
        run: npm run typecheck
      - name: build
        working-directory: ui/admin
        run: npm run build

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install mkdocs
        run: pip install mkdocs-material
      - name: build site
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "mkdocs.yml not present yet; skipping"
          fi
