name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha is missing a DCO sign-off line"
              missing=1
            fi
          done
          exit $missing

  build:
    name: build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: |
          if find . -name go.mod -not -path './vendor/*' | grep -q .; then
            go vet ./...
          else
            echo "no Go modules yet; skipping"
          fi
      - name: build
        run: |
          if find . -name go.mod -not -path './vendor/*' | grep -q .; then
            go build ./...
          else
            echo "no Go modules yet; skipping"
          fi
      - name: test
        run: |
          if find . -name go.mod -not -path './vendor/*' | grep -q .; then
            go test ./...
          else
            echo "no Go modules yet; skipping"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

  softhsm-integration:
    name: hsm-broker softhsm integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: install softhsm2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: init token
        id: token
        run: |
          mkdir -p /tmp/softhsm-test/tokens
          cat > /tmp/softhsm-test/softhsm2.conf <<'EOF'
          directories.tokendir = /tmp/softhsm-test/tokens
          objectstore.backend = file
          log.level = ERROR
          EOF
          SOFTHSM2_CONF=/tmp/softhsm-test/softhsm2.conf softhsm2-util \
            --init-token --slot 0 --label aether-ci --pin 1234 --so-pin 5678
          SLOT=$(SOFTHSM2_CONF=/tmp/softhsm-test/softhsm2.conf softhsm2-util \
            --show-slots | awk '/^Slot/{print $2; exit}')
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
      - name: run integration tests
        working-directory: services/hsm-broker
        env:
          AETHER_SOFTHSM_LIB: /usr/lib/softhsm/libsofthsm2.so
          AETHER_SOFTHSM_SLOT: ${{ steps.token.outputs.slot }}
          AETHER_SOFTHSM_PIN: '1234'
          SOFTHSM2_CONF: /tmp/softhsm-test/softhsm2.conf
        run: go test -count=1 ./internal/backend/softhsm/... -v

  ui:
    name: ui build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
      - name: install
        working-directory: ui/admin
        run: npm ci || npm install
      - name: typecheck
        working-directory: ui/admin
        run: npm run typecheck
      - name: build
        working-directory: ui/admin
        run: npm run build

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install mkdocs
        run: pip install mkdocs-material
      - name: build site
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "mkdocs.yml not present yet; skipping"
          fi
