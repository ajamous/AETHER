  - package-ecosystem: "docker"
    directory: "/services/smds"
    schedule: { interval: "weekly", day: "tuesday", time: "09:00", timezone: "Etc/UTC" }
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "smds(deps): " }

  - package-ecosystem: "docker"
    directory: "/ui/admin"
    schedule: { interval: "weekly", day: "tuesday", time: "09:00", timezone: "Etc/UTC" }
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "ui(deps): " }

  # ---- Go modules ---------------------------------------------------------
  # Workspaces don't share a go.sum; one entry per module. Grouping is
  # per-module rather than across modules so per-service test suites
  # cover the actual upgrade path each PR introduces.

  - package-ecosystem: "gomod"
    directory: "/pkg/asn1/sgp22/go"
    schedule: { interval: "weekly", day: "wednesday", time: "09:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 3
    groups: { patch-and-minor: { update-types: ["patch", "minor"] } }
    labels: ["dependencies", "go"]
    commit-message: { prefix: "asn1(deps): " }

